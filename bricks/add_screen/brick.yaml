name: add_screen
description: >
  Adds a new screen (presentation layer only) to an existing feature.
  Generates BLoC or Cubit + view, updates the feature barrel, routes, and DI.
version: 0.1.0+1

vars:
  feature_name:
    type: string
    description: The existing feature to add the screen to (snake_case)
    prompt: "Feature name (e.g. auth, profile)"
  screen_name:
    type: string
    description: The new screen name (snake_case)
    prompt: "Screen name (e.g. signup, forgot_password, otp_verification)"
  state_management:
    type: enum
    description: State management approach for this screen
    prompt: "State management"
    values:
      - bloc
      - cubit
    default: bloc
